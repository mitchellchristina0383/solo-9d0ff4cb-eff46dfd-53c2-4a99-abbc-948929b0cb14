services:
  bisect:
    build: .
    ports:
      - "8000:8000"
    # Swagger UI: http://localhost:8000/docs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/').status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  tests:
    build: .
    profiles: ["test"]
    volumes:
      - .:/srv
    command: sh -c "pip install -q -r requirements-dev.txt && python -m pytest tests -q"
